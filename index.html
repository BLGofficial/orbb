<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>XYP3RN ORB</title>
<meta name="description" content="XYP3RN voice assistant">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root{--gold:#e7a51b;--gold-hi:#ffd95d;--text:#f3e3b5;--dim:rgba(243,227,181,.55);--ink:#000;--panel:#0b0906;--line:rgba(231,165,27,.28);--err:#ff6b4a;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--gold);font:500 12px/1.2 var(--mono);letter-spacing:.12em;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
/* utilities used inside <Orb> (Tailwind names; this page ships without Tailwind) */
.absolute{position:absolute}.relative{position:relative}.inset-0{inset:0}.block{display:block}.h-full{height:100%}.w-full{width:100%}.z-10{z-index:10}.overflow-hidden{overflow:hidden}.bg-black{background:#000}
.stage{position:fixed;inset:0}
.poster{position:absolute;inset:0;margin:auto;width:46%;height:auto;max-height:46%;filter:drop-shadow(0 0 24px rgba(231,165,27,.55))}
button{font:inherit;letter-spacing:inherit;color:var(--gold);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:0;min-height:44px;padding:0 12px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button.on{color:#000;background:var(--gold);border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
input,select,textarea{font:400 16px/1.35 var(--sans);letter-spacing:0;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px;width:100%;min-height:44px}
textarea{resize:vertical}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.brand{opacity:.85;white-space:nowrap}
.tools{display:flex;gap:6px;min-width:0}
.chip{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:36px;font-size:11px}
.sq{min-height:36px;font-size:11px}
.dock{position:absolute;left:0;right:0;bottom:0;display:grid;gap:8px;padding:48px 16px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(to top,rgba(0,0,0,.94) 0,rgba(0,0,0,.82) 72%,transparent)}
.log{max-height:32vh;overflow-y:auto;display:grid;gap:8px;font:400 15px/1.45 var(--sans);letter-spacing:0;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px);mask-image:linear-gradient(to bottom,transparent,#000 24px);padding-top:20px}
.log p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.log .user{color:var(--dim);text-align:right}
.log .assistant{color:var(--text)}
.log .interim{font-style:italic}
.err{margin:0;color:var(--err);font:400 13px/1.4 var(--sans);letter-spacing:0}
.status{font-size:10px;opacity:.7;text-align:center}
.input{display:grid;grid-template-columns:1fr auto;gap:6px}
.input input{background:rgba(0,0,0,.6)}
.mic{min-height:56px;border-color:var(--gold);font-size:13px}
.mic.live{background:var(--gold);color:#000}
.ghost{background:transparent}
.sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;background:rgba(0,0,0,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.sheet>*{max-width:560px;margin-left:auto;margin-right:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{margin:0;font-size:14px;letter-spacing:.2em;color:var(--gold-hi)}
fieldset{border:1px solid var(--line);margin:0 auto 12px;padding:12px}
legend{padding:0 6px;font-size:11px;color:var(--gold-hi)}
label{display:grid;gap:6px;margin-top:12px;font-size:11px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px}
.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.providers button{font-size:11px;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;min-height:20px;accent-color:var(--gold)}
.hint{margin:8px 0 0;color:var(--dim);font:400 13px/1.45 var(--sans);letter-spacing:0}
.notice{border:1px solid var(--gold);color:var(--gold-hi);padding:10px 12px;font:400 14px/1.4 var(--sans);letter-spacing:0;margin:0 auto 12px}
.danger{color:var(--err);border-color:var(--err);margin-top:10px;width:100%}
@media (min-width:720px){.dock{left:50%;right:auto;width:600px;transform:translateX(-50%)}.providers{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="root"></div><script src="/app.js"></script></body>
</html>
