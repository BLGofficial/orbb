<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XYP3RN ORB</title>
<meta name="description" content="XYP3RN real-time energy orb">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root{--gold:#e7a51b;--gold-hi:#ffd95d;--ink:#000;--line:rgba(231,165,27,.28);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--gold);font:500 12px/1.2 var(--mono);letter-spacing:.14em;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.stage{position:fixed;inset:0;overflow:hidden;background:#000}
.orb{position:absolute;inset:0;display:block;width:100%;height:100%}
[hidden]{display:none!important}
.poster{position:absolute;inset:0;margin:auto;width:46%;height:auto;max-height:46%;filter:drop-shadow(0 0 24px rgba(231,165,27,.55))}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 16px 0;opacity:.85}
.dock{position:absolute;left:0;right:0;bottom:0;display:grid;gap:10px;padding:0 16px calc(env(safe-area-inset-bottom) + 16px)}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;letter-spacing:inherit;color:var(--gold);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:0;min-height:44px;padding:0 6px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button.on{color:#000;background:var(--gold);border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.mic.live{border-color:var(--gold);color:var(--gold-hi)}
input[type=range]{width:100%;accent-color:var(--gold);height:44px;margin:0}
@media (min-width:720px){.dock{left:50%;right:auto;width:560px;transform:translateX(-50%)}.states{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<main id="stage" class="stage">
<header class="top"><span>XYP3RN // ORB</span><span id="label" aria-live="polite">IDLE</span></header>
<nav id="dock" class="dock" hidden>
<input id="progress" aria-label="Render progress" type="range" min="0" max="1" step="0.01" hidden>
<button id="mic" class="mic" type="button" hidden>ENABLE MIC FOR AUDIO REACTION</button>
<div id="states" class="states" role="radiogroup" aria-label="Orb state"></div>
</nav>
</main>
<script src="/app.js"></script>
</body>
</html>
